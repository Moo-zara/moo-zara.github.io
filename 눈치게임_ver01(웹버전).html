<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커피 내기 눈치게임 PRO v1.0</title>
    <style>
        body { margin: 0; padding: 0; background-color: #141414; color: white; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #gameCanvas { border: 2px solid #333; background: radial-gradient(circle, #202020 0%, #101010 100%); cursor: default; }
        #restartBtn { display: none; position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 15px 30px; font-size: 24px; background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1000" height="700"></canvas>
    <button id="restartBtn">당첨! 다시 하기</button>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restartBtn');

    let state = "MENU";
    let total = 20, bombs = 1, shake = 0, blinkTimer = 0;
    let marbles = [];
    const MARBLE_RADIUS = 25;
    const MARBLE_GAP = 70;

    // 버튼 영역 정의 (가시성 확보)
    const btns = {
        totalPlus:  {x: 550, y: 195, w: 30, h: 30, action: () => total = Math.min(60, total + 1)},
        totalMinus: {x: 550, y: 235, w: 30, h: 30, action: () => total = Math.max(1, total - 1)},
        bombsPlus:  {x: 550, y: 295, w: 30, h: 30, action: () => bombs = Math.min(total, bombs + 1)},
        bombsMinus: {x: 550, y: 335, w: 30, h: 30, action: () => bombs = Math.max(1, bombs - 1)},
        start:      {x: 400, y: 500, w: 250, h: 50}
    };

    function resetGame() {
        marbles = [];
        for (let i = 0; i < total; i++) marbles.push({clicked: false, isBomb: false, flash: 0});
        let bombIndices = [];
        while (bombIndices.length < Math.min(bombs, total)) {
            let r = Math.floor(Math.random() * total);
            if (!bombIndices.includes(r)) bombIndices.push(r);
        }
        bombIndices.forEach(idx => marbles[idx].isBomb = true);
        restartBtn.style.display = 'none';
        canvas.style.cursor = 'default';
    }

    function draw3DMarble(x, y, color, flash) {
        // 그림자
        ctx.beginPath(); ctx.arc(x+3, y+3, MARBLE_RADIUS, 0, Math.PI*2); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
        // 몸통 (Flash 효과 적용)
        let f = Math.min(flash * 50, 100);
        let c = [Math.min(color[0]+f, 255), Math.min(color[1]+f, 255), Math.min(color[2]+f, 255)];
        ctx.beginPath(); ctx.arc(x, y, MARBLE_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = `rgb(${c[0]}, ${c[1]}, ${c[2]})`; ctx.fill();
        // 빛 반사 (하이라이트)
        ctx.beginPath(); ctx.arc(x-8, y-8, 8, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
    }

    function drawUI() {
        ctx.fillStyle = "white"; ctx.font = "bold 30px Malgun Gothic";
        ctx.fillText(`구슬 개수: ${total}`, 300, 220);
        ctx.fillText(`당첨 개수: ${bombs}`, 300, 320);

        // 화살표 버튼 시각화
        Object.keys(btns).forEach(key => {
            if (key === 'start') return;
            const b = btns[key];
            ctx.fillStyle = (b.action ? "#00FFFF" : "white"); // 클릭 가능 버튼은 청록색
            ctx.fillText(key.includes('Plus') ? "▲" : "▼", b.x + 5, b.y + 25);
        });

        // 시작 버튼
        ctx.fillStyle = "#00FF00"; ctx.fillText("▶ 게임 시작하기", btns.start.x, btns.start.y + 35);
    }

    function update() {
        blinkTimer++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 화면 진동 (Shake) 오프셋
        let ox = (shake > 0 ? (Math.random()*2-1)*shake : 0);
        let oy = (shake > 0 ? (Math.random()*2-1)*shake : 0);
        if (shake > 0) shake *= 0.95; // 자연스럽게 감소

        if (state === "MENU") { drawUI(); } 
        else {
            marbles.forEach((m, i) => {
                const row = Math.floor(i / 12), col = i % 12;
                const x = 100 + col * MARBLE_GAP + ox, y = 100 + row * MARBLE_GAP + oy;
                if (m.flash > 0) m.flash -= 0.1;
                
                let color = [100, 100, 200]; // 기본 파란색
                if (m.clicked) color = (m.isBomb ? [200, 50, 50] : [100, 100, 100]); // 당첨 빨강, 꽝 회색
                
                // 결과 오픈 연출
                if (state === "RESULT" && m.isBomb && (Math.floor(blinkTimer / 10) % 2 === 0)) color = [255, 255, 0]; // 노란색 점멸
                else if (state === "RESULT" && !m.clicked) color = (m.isBomb ? [255, 0, 0] : [50, 50, 50]);
                
                draw3DMarble(x, y, color, m.flash);
            });
        }
        requestAnimationFrame(update);
    }

    canvas.addEventListener('mousedown', (e) => {
        const mx = e.offsetX, my = e.offsetY;
        if (state === "MENU") {
            Object.keys(btns).forEach(key => {
                const b = btns[key];
                if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
                    if (b.action) { b.action(); } 
                    else if (key === 'start') { resetGame(); state = "PLAY"; canvas.style.cursor = 'pointer';}
                }
            });
            // 값 제한
            total = Math.max(1, Math.min(60, total));
            bombs = Math.max(1, Math.min(total, bombs));
        } else if (state === "PLAY") {
            // 일반 클릭 진동
            shake = 3;
            marbles.forEach((m, i) => {
                const row = Math.floor(i / 12), col = i % 12;
                const x = 100 + col * MARBLE_GAP, y = 100 + row * MARBLE_GAP;
                const dist = Math.sqrt((mx-x)**2 + (my-y)**2);
                if (dist < MARBLE_RADIUS && !m.clicked) {
                    m.clicked = true; m.flash = 2;
                    if (m.isBomb) { state = "RESULT"; shake = 40; restartBtn.style.display = 'block'; canvas.style.cursor = 'default'; }
                }
            });
        }
    });

    restartBtn.addEventListener('click', () => { state = "MENU"; });
    update(); // 게임 루프 시작

</script>
</body>
</html>
